<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where the two tools fit around the Universal Dendrimer Builder</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c93"/>
    </marker>
  </defs>
  <rect width="1000" height="300" rx="14" fill="#0f1623"/>

  <!-- 1 Avogadro -->
  <rect x="24" y="64" width="190" height="112" rx="10" fill="#131d30" stroke="#1c2840" stroke-width="1.5"/>
  <text x="119" y="98" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="600">Draw fragments</text>
  <text x="119" y="122" text-anchor="middle" fill="#6b7c93" font-size="13">Avogadro</text>
  <text x="119" y="150" text-anchor="middle" fill="#6b7c93" font-size="12">core + monomer · Sybyl MOL2</text>

  <!-- 2 Parameterization GUI (this repo) -->
  <rect x="262" y="52" width="210" height="136" rx="10" fill="#0a2236" stroke="#38bdf8" stroke-width="2"/>
  <text x="367" y="84" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="1">THIS REPO</text>
  <text x="367" y="108" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="600">Parameterization GUI</text>
  <text x="367" y="132" text-anchor="middle" fill="#9fb3c8" font-size="12">Sybyl → GAFF2 MOL2</text>
  <text x="367" y="152" text-anchor="middle" fill="#9fb3c8" font-size="12">AMBER · NAMD · GROMACS</text>
  <text x="367" y="172" text-anchor="middle" fill="#9fb3c8" font-size="12">validation + frcmod penalties</text>

  <!-- 3 UDB -->
  <rect x="520" y="64" width="200" height="112" rx="10" fill="#131d30" stroke="#1c2840" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="98" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="600">Universal Dendrimer</text>
  <text x="620" y="118" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="600">Builder</text>
  <text x="620" y="146" text-anchor="middle" fill="#6b7c93" font-size="12">build G1–G10 · minimise · MD</text>
  <text x="620" y="164" text-anchor="middle" fill="#6b7c93" font-size="11">(separate repository)</text>

  <!-- 4 Characteriser (this repo) -->
  <rect x="768" y="52" width="208" height="136" rx="10" fill="#0a2a24" stroke="#06d6a0" stroke-width="2"/>
  <text x="872" y="84" text-anchor="middle" fill="#06d6a0" font-size="12" font-weight="600" letter-spacing="1">THIS REPO</text>
  <text x="872" y="108" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="600">UDB Characteriser</text>
  <text x="872" y="132" text-anchor="middle" fill="#9fb3c8" font-size="12">117 properties · QC</text>
  <text x="872" y="152" text-anchor="middle" fill="#9fb3c8" font-size="12">size · shape · SASA · Rh</text>
  <text x="872" y="172" text-anchor="middle" fill="#9fb3c8" font-size="12">back-folding · charge</text>

  <!-- forward arrows -->
  <line x1="216" y1="120" x2="258" y2="120" stroke="#6b7c93" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="474" y1="120" x2="516" y2="120" stroke="#6b7c93" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="722" y1="120" x2="764" y2="120" stroke="#6b7c93" stroke-width="2" marker-end="url(#arr)"/>
  <text x="495" y="110" text-anchor="middle" fill="#6b7c93" font-size="10">GAFF2</text>
  <text x="743" y="110" text-anchor="middle" fill="#6b7c93" font-size="10">MOL2</text>

  <!-- back arrow: UDB output -> Extract mol2 -->
  <path d="M620,178 L620,240 L367,240 L367,192" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="494" y="262" text-anchor="middle" fill="#38bdf8" font-size="12">Extract mol2: finished GAFF2 dendrimer → Sybyl MOL2 / PDB</text>

  <text x="24" y="34" fill="#edf2f4" font-size="15" font-weight="600">Where the two tools fit</text>
  <text x="24" y="290" fill="#6b7c93" font-size="11">Solid boxes: tools in this repository. Dashed: the Universal Dendrimer Builder.</text>
</svg>
